# .github/workflows/build.yml
name: Build & Push Kasm Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Chaque lundi automatique

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Build & Push
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/kali-linux:latest .
          docker push ghcr.io/${{ github.repository_owner }}/kali-linux:latest